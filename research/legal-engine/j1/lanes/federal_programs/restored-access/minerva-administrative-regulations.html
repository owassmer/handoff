// Handler (Start Button): Submits request for next n records (n=threshold).
function getStart( ) {
   if(!isMobile()) document.getElementById("loading").style.display = "inline";
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var end = parseInt(document.BrowseForm.EndIndex.value);
	if ( num_totalhits < threshold ) {
		end = num_totalhits ;
	} else {
		end = threshold ;
	}
	document.BrowseForm.StartIndex.value = 1 ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

//- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
// Handler (End Button): Submits request for next n records (n=threshold).
function getEnd( ) {
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var start = parseInt(document.BrowseForm.StartIndex.value) ;
	end = num_totalhits ;
	start = num_totalhits - (num_totalhits - 1) % threshold ;
	document.BrowseForm.StartIndex.value = start ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

// Handler (Next Button): Submits request for next n records (n=threshold).
function getNext( ) {
   if(!isMobile()) document.getElementById("loading").style.display = "inline";
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var start = parseInt(document.BrowseForm.StartIndex.value) + threshold ;
	var end = parseInt(document.BrowseForm.StartIndex.value) + (threshold*2) - 1 ;
	if ( end > num_totalhits ) {
	  end = num_totalhits ;
	}
	if ( start <= num_totalhits ) {
		document.BrowseForm.StartIndex.value = start ;
	}
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

// Handler (Previous Button): Submits request for previous n records (n=threshold).
function getPrevious( ) {
   if(!isMobile()) document.getElementById("loading").style.display = "inline";
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var start = parseInt(document.BrowseForm.StartIndex.value) - threshold ;
	var end = parseInt(document.BrowseForm.EndIndex.value) -
	          parseInt(document.BrowseForm.EndIndex.value) +
	          parseInt(document.BrowseForm.StartIndex.value) - 1 ;
	
	if ( end < 0 ) {
	  end = threshold ;
	}
	if ( start < 0 ) {
	  start = 1 ;
	}
	if ( end < threshold ) {
	  end = threshold ;
	}
	document.BrowseForm.StartIndex.value = start ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

function selectpage(pg){
   if(!isMobile()) document.getElementById("loading").style.display = "inline";
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var start = (pg-1) * threshold + 1;

	if ( end > num_totalhits ) end = num_totalhits ;
   document.BrowseForm.StartIndex.value = start ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

function showpage(url,id){
   var xmlhttp;
   if (window.XMLHttpRequest) {
     xmlhttp=new XMLHttpRequest();
   }
   else {
     xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
   }
   xmlhttp.onreadystatechange=function() {
      if(xmlhttp.readyState==4 && xmlhttp.status == 200) {
         document.getElementById(id).innerHTML = xmlhttp.responseText;
         var res = document.getElementById(id);
         var arr = res.getElementsByTagName("script");
         for (var n=0; n<arr.length; n++) {
            eval(arr[n].innerHTML);
         }
      }
   }
   xmlhttp.open("GET",url,true);
   xmlhttp.send(null);
}

function getSearchKey(key) {
  var re = new RegExp( "[?&]" + key + "=([^&$]*)", "i" );
  var offset = location.search.search( re );
  if ( offset == -1 ) return null;
  return decodeURIComponent(RegExp.$1);
}

function getBrowseTableId(sData) {
   sData = unescape(sData);
   var arr_cmd_action = sData.split("&");
   for(i=0;i<arr_cmd_action.length;i++) {
      if(arr_cmd_action[i].substring(0,9) == "ProcessID") {
         retval = arr_cmd_action[i].substring(10,20).split("_");
         return (retval[0] == getTableId()) ? "" : retval[0]+"_";
      }
   }
   return "";
}

      var sel = document.getElementById("GoProcessSelect");

      opt.text = op[i].innerHTML;
      opt.value = op[i].value+"Member_Go_Process";

   }

      document.getElementById('GoProcessSelect').getElementsByTagName('option')[0].selected = 'selected';

}
