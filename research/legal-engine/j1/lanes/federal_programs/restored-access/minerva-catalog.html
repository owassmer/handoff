function restoreSearchTerm(){
   for(si=0;si<document.getElementById('SearchForm').length;si++){
      var el = document.getElementById('SearchForm').elements[si];
      var vl = Cookie.read(sysFolder+tableID+el.name);

      if(vl){
         if(el.type == "text") {
            el.value = vl;
            if(document.getElementById('key'+el.id)) document.getElementById('key'+el.id).value =  Cookie.read(sysFolder+tableID+'key'+el.id);
         }
         else if(el.type == "checkbox") {
            el.checked = vl;
         }
         else if(el.type == "select-one") {
            el.selectedIndex = vl;
         }
      }
   }
}

function storeSearchTerm(){
	var frst = true;
   setCookie(sysFolder+tableID+"ESIKeyword","",30); 
   for(si=0;si<document.getElementById('SearchForm').length;si++){
      var el = document.getElementById('SearchForm').elements[si];
      var vl = el.value;

      if(el.type == "text"){
         Cookie.create(sysFolder+tableID+el.name, el.value);
         if(frst && el.value!=""){
            setCookie(sysFolder+tableID+"ESIKeyword",el.value,30); 
            frst = false;
         }
         if(document.getElementById('key'+el.id)) Cookie.create(sysFolder+tableID+'key'+el.id, document.getElementById('key'+el.id).value);
      }
      else if(el.type == "checkbox"){
         Cookie.create(sysFolder+tableID+el.name, (el.checked?el.checked:""));
      }
      else if(el.type == "select-one"){
         Cookie.create(sysFolder+tableID+el.name, el.selectedIndex);
      }
   }
}

function clearSearchTerm(){
	for(si=0;si<document.getElementById('SearchForm').length;si++){
      var el = document.getElementById('SearchForm').elements[si];
      var vl = Cookie.read(sysFolder+tableID+el.name);

		if(vl){
         if(el.type == "text"){
            Cookie.create(sysFolder+tableID+el.name, "");
            if(document.getElementById('key'+el.id)){ 
               document.getElementById('key'+el.id).value = "";
               Cookie.create(sysFolder+tableID+'key'+el.id, "");
            }
         }
         else if(el.type == "checkbox"){
            Cookie.create(sysFolder+tableID+el.name, "");
         }
         else if(el.type == "select-one"){
            Cookie.create(sysFolder+tableID+el.name, 0);
         }
      }
   }
   setCookie(sysFolder+tableID+"ESIKeyword","",30); 
   location.href = location.href;
}

function publicGeneratePopulatedPointerPrompt(promptID,aryOption,rows,flBlank,curSelections,pIncludeLowerLevel,pYesNoToCheckbox,promptName) {
	if (promptID == "") return "";
	if (aryOption == null || aryOption == "" || aryOption.length == 0) return "";
	var prName = (promptID=="0"? '' : 'ID="' + promptID + '" NAME="POI30_' + promptID + '" ');
	var prMultiSel = (rows=="1"? '' : 'MULTIPLE ');
	var sDropdownDefinition ='<SELECT TABINDEX="1" ' + prName + '" CLASS="form-control" STYLE="width:auto;" ONKEYDOWN="if(event.keyCode==13) doSearch4();">\n';
	if (flBlank == true) {
		sDropdownDefinition += '<OPTION VALUE=""> </OPTION>\n';
	}
	for (var jDA = 0; jDA < aryOption.length; jDA++) {
      var currentOption = aryOption[jDA].split('|');
      var searchText = " " + currentOption[0] + " ";
      // "!" search all lower level on dropdown prompt
      sDropdownDefinition += '<OPTION ID="'+ (pIncludeLowerLevel == '1' ? '!' : '') +'" VALUE="' + (pIncludeLowerLevel == '1' ? '!' : '') + currentOption[0] + '"';
      if (curSelections.indexOf(searchText) != -1) {
             sDropdownDefinition += ' SELECTED';
      }
      sDropdownDefinition += '>';
      sDropdownDefinition += unescapeUTF(currentOption[1]);
      sDropdownDefinition += '<\/OPTION>\n';
	}
	sDropdownDefinition += '<\/SELECT>\n';
   // Convert YES/No dropdown to checkbox
   if(sDropdownDefinition.indexOf('<OPTION ID="!" VALUE="!120">') > 0 && sDropdownDefinition.indexOf('<OPTION ID="!" VALUE="!119">') > 0 && pYesNoToCheckbox == '1') {
      sDropdownDefinition = '<INPUT  TABINDEX="1" TYPE="CHECKBOX" '+ prName+' VALUE="119" ONKEYDOWN="if(event.keyCode==13) doSearch4();" ARIA-LABEL="'+promptName+'">';
   }
   if(sDropdownDefinition.indexOf('<OPTION ID="" VALUE="120">') > 0 && sDropdownDefinition.indexOf('<OPTION ID="" VALUE="119">') > 0 && pYesNoToCheckbox == '1') {
      sDropdownDefinition = '<INPUT  TABINDEX="1" TYPE="CHECKBOX" '+ prName+' VALUE="119" ONKEYDOWN="if(event.keyCode==13) doSearch4();" ARIA-LABEL="'+promptName+'">';
   }
	return sDropdownDefinition;
}

function doSearch4() {
   var sURL = cmd_action;
   sURL += "&CMD_(SearchRequest)[12]=&PromptID=&ParamID=&RequesterType=SearchTemplate&browseData=1&bCachable=1&Keyword=0&";

   cnt = 0
   for(mi=0;mi<aPromptId.length;mi++){
      var y = document.getElementById(aPromptId[mi]);
      if(y.value.replace(/\*/g,"").replace(/\?/g,"").length == 0) y.value = "";
      var sValue = y.value; 
      if(y.type == "checkbox" && ! y.checked) sValue = "";
      if(sValue != "") {
		 try{
			var k = document.getElementById("key"+aPromptId[mi]);
			if(k.value){
				sURL += y.name + '=KEY_' + k.value + '&';				
			}
			else {
				sURL += y.name + '=' + encodeURIComponent(sValue) + '&';
			}
		 } catch(err) {
			sURL += y.name + '=' + encodeURIComponent(sValue) + '&';
		 }
         cnt ++;
      }
	}

	if(cnt>0){
      if(!isMobile()) {
         document.getElementById("loading").style.display = "inline";
         document.getElementById("loading").focus();
      }
      storeSearchTerm();
      location.href = sURL.substring(0,sURL.length-1);
   }
}

function showpage(url,id){
   var xmlhttp;
   if (window.XMLHttpRequest) {
     xmlhttp=new XMLHttpRequest();
   }
   else {
     xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
   }
   xmlhttp.onreadystatechange=function() {
      if(xmlhttp.readyState==4 && xmlhttp.status == 200) {
         document.getElementById(id).innerHTML = xmlhttp.responseText;
         var res = document.getElementById(id);
         var arr = res.getElementsByTagName("script");
         for (var n=0; n<arr.length; n++) {
            eval(arr[n].innerHTML);
         }
      }
   }
   xmlhttp.open("GET",url,true);
   xmlhttp.send(null);
}

function checkStatus(){
   if(location.href.indexOf("UserName")!=-1) Cookie.create(sysFolder+tableID+"searchURL", location.href.replace('&nd=1','').replace('&nd=2','').replace('&nd=3',''));
   var sURL = cmd_action.replace("Action?","DoMenuRequest?").replace('&nd=1','').replace('&nd=2','').replace('&nd=3','');
   if(location.href.indexOf('nd=1')!=-1){
      alert("Your search did not match any records in our database. Please adjust your search criteria and try again.");
      location.href = sURL;
   }
   else if(location.href.indexOf('nd=2')!=-1){
      alert("Your search returned too many results. Please refine your search terms and try again."); 
      location.href = sURL;
   }
   else if(location.href.indexOf('nd=3')!=-1){
      alert("Your session has expired due to inactivity. Please return to the Search Page to start a new search."); 
      location.href = sURL;
   }
}
