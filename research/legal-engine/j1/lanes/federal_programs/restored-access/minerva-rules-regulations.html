// Handler (Start Button): Submits request for next n records (n=threshold).
function getStart( ) {
   if(!isMobile()) document.getElementById("loading").style.display = "inline";
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var end = parseInt(document.BrowseForm.EndIndex.value);
	if ( num_totalhits < threshold ) {
		end = num_totalhits ;
	} else {
		end = threshold ;
	}
	document.BrowseForm.StartIndex.value = 1 ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

// Handler (End Button): Submits request for next n records (n=threshold).
function getEnd( ) {
	var threshold = parseInt(document.BrowseForm.Threshold.value);
	var start = parseInt(document.BrowseForm.StartIndex.value) ;
	end = num_totalhits ;
	start = num_totalhits - (num_totalhits - 1) % threshold ;
	document.BrowseForm.StartIndex.value = start ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

// Handler (Next Button): Submits request for next n records (n=threshold).
function getNext( ) {
   if(!isMobile()) document.getElementById("loading").style.display = "inline";

	var start = parseInt(document.BrowseForm.StartIndex.value) + threshold ;
	var end = parseInt(document.BrowseForm.StartIndex.value) + (threshold*2) - 1 ;
	if ( end > num_totalhits ) {
	  end = num_totalhits ;
	}
	if ( start <= num_totalhits ) {
		document.BrowseForm.StartIndex.value = start ;
	}
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

	  end = threshold ;
	}
	if ( start < 0 ) {
	  start = 1 ;
	}
	if ( end < threshold ) {
	  end = threshold ;
	}
	document.BrowseForm.StartIndex.value = start ;
	document.BrowseForm.EndIndex.value = end ;
	requestBrowse( ) ;
}

function getSearchKey(key) {
  var re = new RegExp( "[?&]" + key + "=([^&$]*)", "i" );

  return decodeURIComponent(RegExp.$1);
}
