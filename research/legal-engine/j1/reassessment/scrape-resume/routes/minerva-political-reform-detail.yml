    - generic [ref=f7e75]:
      - generic [ref=f7e76]: "Organization/Arrangement:"
      - generic [ref=f7e77]: "Arranged in ten series: 1) Candidate and Candidate Controlled Committees Campaign Disclosure Statements; 2) Judges Campaign Disclosure Statements; 3) Miscellaneous Committee Campaign Disclosure Statements; 4) Central Committee Campaign Disclosure Statements; 5) Major Donor Campaign Disclosure Statements; 6) Slate Mailer Organization Disclosure Statements; 7) Lobbyist Statements; 8) Lobbying Firm Statements; 9) Lobbyist Employer Statements; and, 10) Terminated Statements (Lobbyists)."
    - generic [ref=f7e78]:
      - generic [ref=f7e79]: "Scope and content:"
      - generic [ref=f7e80]:
        - text: The Political Reform Division administers provisions of California's Political Reform Act, including the law's most fundamental purpose of ensuring that "receipts and expenditures in election campaigns should be fully and truthfully disclosed in order that the voters may be fully informed and the activities of lobbyists should be regulated and their finances disclosed. . ." The Political Reform Act was adopted as a statewide initiative (Proposition 9) by an over-whelming vote of the electorate in 1974. The law requires detailed disclosure of the role of money in California politics. This includes the disclosure of contributions and expenditures in connection with campaigns supporting or opposing state and local candidates and ballot measures as well as the disclosure of expenditures made in connection with lobbying the State Legislature and attempting to influence administrative decisions of state government.For receipts and expenditures filed with the Secretary of State prior to the passage of the Political Reform Act of 1974, see the Elections Division Records.
        - generic [ref=f7e81]: It should be noted that, while the Political Reform Division does register and issue identification numbers for local campaign committees that raise funds in connection with local elections throughout California, local campaign committees and candidates for local offices file their itemized disclosure statements with local filing officers.
